include:
  - project: "trixgo-vn/devops/gitlab-ci-template"
    file: "/.Docker.gitlab-ci.yml"

build-docker-staging:
  extends: .build-docker-template
  before_script:
    - _DOCKER_CACHE_IMAGE_TAG=`echo $CI_COMMIT_REF_NAME | sed -E 's/[^a-z0-9._-]+/__/g'`
    - _DOCKER_RELEASE_IMAGE_TAG="$_DOCKER_CACHE_IMAGE_TAG-`printf %010d $CI_PIPELINE_ID`-$CI_COMMIT_SHORT_SHA"
    - |
      cat <<EOF > .env.production
      NEXT_PUBLIC_API_MODE=mock
      NEXT_PUBLIC_API_URL=https://api.trixgo.com
      NEXT_PUBLIC_API_TIMEOUT=30000
      NEXT_PUBLIC_CLOUDFRONT_URL=https://dntdurzwr12tp.cloudfront.net
      NEXT_PUBLIC_IMAGE_PREFIX=https://dntdurzwr12tp.cloudfront.net
      NEXT_PUBLIC_DEFAULT_TOKEN=$NEXT_PUBLIC_DEFAULT_TOKEN
      NEXT_PUBLIC_OPENAI_API_KEY=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
      EOF
  tags:
    - docker-xlarge
  only:
    refs:
      - staging

